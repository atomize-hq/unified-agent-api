name: Agent maintenance open PR

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
      current_version:
        required: true
        type: string
      latest_stable:
        required: true
        type: string
      target_version:
        required: true
        type: string
      opened_from:
        required: true
        type: string
      detected_by:
        required: true
        type: string
      dispatch_kind:
        required: true
        type: string
      dispatch_workflow:
        required: false
        type: string
      branch_name:
        required: true
        type: string
      add_paths:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      agent_id:
        required: true
        type: string
      current_version:
        required: true
        type: string
      latest_stable:
        required: true
        type: string
      target_version:
        required: true
        type: string
      opened_from:
        required: true
        type: string
      detected_by:
        required: true
        type: string
      dispatch_kind:
        required: true
        type: string
      dispatch_workflow:
        required: false
        type: string
      branch_name:
        required: true
        type: string
      add_paths:
        required: true
        type: string

concurrency:
  group: agent-maintenance-${{ inputs.branch_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    outputs:
      # `pull-request-operation` distinguishes a live branch from the `closed` path, where
      # create-pull-request deletes the branch but still reports a pull-request-number.
      branch_created: ${{ steps.create_pr.outcome == 'success' && (steps.create_pr.outputs.pull-request-operation == 'created' || steps.create_pr.outputs.pull-request-operation == 'updated') }}
      acquire: ${{ steps.acquisition_gate.outputs.acquire }}
      # The acquisition's verdict has to reach this PR, and the job that decides it cannot name the
      # PR: `parity-acquire` is handed a ref, not a number. Export it here, where it is known.
      pull_request_number: ${{ steps.create_pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
      - uses: dtolnay/rust-toolchain@stable
      # Destructive boundary 1 of 3: request regeneration. `prepare-agent-maintenance --write`
      # rewrites `request_recorded_at`, and `request.rs` digests the whole request file, so this
      # step alone invalidates a closeout bound to the previous generation — committed or not.
      - name: Check packet stand-down before regenerating the request
        id: stand_down
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          # Built separately, as the acquisition gate does: a compile failure and a guard answer
          # are different things, and collapsing them would let a broken build read as "no marker".
          cargo build -p xtask

          set +e
          ./target/debug/xtask maintenance-stand-down-check \
            --agent "$AGENT_ID" \
            --target-version "$TARGET_VERSION"
          status=$?
          set -e

          # Exit 0 is the only authorization there is. Exit 3 is the declared stand-down, which is
          # a result rather than a failure; every other exit is a guard that could not answer, and
          # a guard that cannot answer must not authorize a force-push.
          if [[ "$status" -eq 0 ]]; then
            echo "stand_down=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 3 ]]; then
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Packet stood down::${AGENT_ID} ${TARGET_VERSION} is frozen by a maintainer; this run will not regenerate, replace, or supersede it."
          else
            # `::error` annotates but does not fail a step. A guard that cannot answer would
            # otherwise leave the job green with no PR opened, so a flag rename or one malformed
            # marker could stop every maintenance packet for weeks without anything going red.
            # A declared stand-down is a healthy outcome; this is an outage, and must look like one.
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Stand-down check failed::Treating ${AGENT_ID} ${TARGET_VERSION} as frozen, because the guard exited ${status} instead of answering." >&2
            exit 1
          fi
      - name: Prepare maintenance packet
        if: ${{ steps.stand_down.outputs.stand_down != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask -- prepare-agent-maintenance \
            --agent "${{ inputs.agent_id }}" \
            --current-version "${{ inputs.current_version }}" \
            --latest-stable "${{ inputs.latest_stable }}" \
            --target-version "${{ inputs.target_version }}" \
            --opened-from "${{ inputs.opened_from }}" \
            --detected-by "${{ inputs.detected_by }}" \
            --dispatch-kind "${{ inputs.dispatch_kind }}" \
            ${{
              inputs.dispatch_workflow != '' &&
              format('--dispatch-workflow "{0}"', inputs.dispatch_workflow) ||
              ''
            }} \
            --branch-name "${{ inputs.branch_name }}" \
            --request-recorded-at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --request-commit "${{ github.sha }}" \
            --write
      - name: Decide whether this agent takes the multi-target acquisition lane
        id: acquisition_gate
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          # The gate is committed truth, not a second registry field: an agent acquires exactly
          # when it is release-watch enrolled *and* its RULES.json carries an `acquisition` block.
          # `manifest-acquisition-plan` enforces both, so a clean exit is the gate.
          #
          # Build the planner first, separately. A compile failure and a planner rejection are
          # very different things, and collapsing both into `acquire=false` would silently
          # downgrade every agent to the docs-only lane whenever xtask fails to build.
          cargo build -p xtask

          set +e
          ./target/debug/xtask manifest-acquisition-plan \
            --agent "$AGENT_ID" \
            --version "$TARGET_VERSION" \
            --emit-json _ci_tmp_gate.json 2> _ci_tmp_gate.err
          gate_status=$?
          set -e

          # Exit 3 means "not on the acquisition lane", which is an expected answer. Any other
          # non-zero exit is a real regression — a malformed descriptor, a broken registry — and
          # must fail the run rather than quietly downgrading an enrolled agent to docs-only.
          case "$gate_status" in
            0)
              echo "acquire=true" >> "$GITHUB_OUTPUT"
              echo "${AGENT_ID} takes the multi-target acquisition lane."
              ;;
            3)
              echo "acquire=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Docs-only maintenance lane::${AGENT_ID} does not acquire binaries: $(cat _ci_tmp_gate.err)"
              ;;
            *)
              echo "::error title=Acquisition planner failed::${AGENT_ID} is enrolled but its plan could not be resolved (exit ${gate_status}): $(cat _ci_tmp_gate.err)" >&2
              rm -f _ci_tmp_gate.err _ci_tmp_gate.json
              exit 1
              ;;
          esac
          rm -f _ci_tmp_gate.err _ci_tmp_gate.json
      # Destructive boundary 2 of 3: branch replacement and packet-body replacement, and the only
      # boundary that mutates the remote. Asked again against a *freshly fetched* base rather than
      # the checkout taken at job start: `create-pull-request` resets the packet branch to current
      # base, so a marker a maintainer lands mid-run is live by the time the push happens, while a
      # re-read of the job-start tree could never see it. That window is the job's whole duration,
      # not the seconds between two steps.
      #
      # This step also runs when the first check already stood down, so that a skipped step cannot
      # leave an empty output that reads as permission.
      - name: Check packet stand-down before replacing the branch
        id: stand_down_recheck
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          # xtask was built by the pre-regeneration check, which has no `if:` and fails the job
          # if the build fails, so this step never runs against a missing binary.
          #
          # The fetch is separate from the read: `--from-ref` treats any git failure as an internal
          # error rather than an absent marker, so an unreachable base stands down instead of
          # authorizing. Nothing is checked out, because the prepared packet is already in the tree.
          git fetch --depth=1 --no-tags origin staging

          set +e
          ./target/debug/xtask maintenance-stand-down-check \
            --agent "$AGENT_ID" \
            --target-version "$TARGET_VERSION" \
            --from-ref FETCH_HEAD
          status=$?
          set -e

          # Exit 0 is the only authorization there is. Exit 3 is the declared stand-down, which is
          # a result rather than a failure; every other exit is a guard that could not answer, and
          # a guard that cannot answer must not authorize a force-push.
          if [[ "$status" -eq 0 ]]; then
            echo "stand_down=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 3 ]]; then
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Packet stood down::${AGENT_ID} ${TARGET_VERSION} is frozen by a maintainer; this run will not regenerate, replace, or supersede it."
          else
            # `::error` annotates but does not fail a step. A guard that cannot answer would
            # otherwise leave the job green with no PR opened, so a flag rename or one malformed
            # marker could stop every maintenance packet for weeks without anything going red.
            # A declared stand-down is a healthy outcome; this is an outage, and must look like one.
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Stand-down check failed::Treating ${AGENT_ID} ${TARGET_VERSION} as frozen, because the guard exited ${status} instead of answering." >&2
            exit 1
          fi
      - name: Create PR
        id: create_pr
        if: ${{ steps.stand_down_recheck.outputs.stand_down != 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          base: staging
          branch: ${{ inputs.branch_name }}
          commit-message: "chore: open maintenance packet for ${{ inputs.agent_id }} ${{ inputs.target_version }}"
          title: "chore: open maintenance packet for ${{ inputs.agent_id }} ${{ inputs.target_version }}"
          body-path: docs/agents/lifecycle/${{ inputs.agent_id }}-maintenance/governance/pr-summary.md
          add-paths: ${{ inputs.add_paths }}
          delete-branch: true
      - name: Close superseded same-agent PRs
        if: ${{ steps.create_pr.outcome == 'success' && steps.create_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          AGENT_ID: ${{ inputs.agent_id }}
          TARGET_VERSION: ${{ inputs.target_version }}
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail
          branch_prefix="automation/${AGENT_ID}-maintenance-"
          strict_version_regex='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "$TARGET_VERSION" =~ $strict_version_regex ]]; then
            echo "::warning::Skipping supersession because TARGET_VERSION is not strict semver: ${TARGET_VERSION}"
            exit 0
          fi

          pr_json="$(gh pr list --state open --limit 500 --json number,headRefName)"

          mapfile -t candidate_prs < <(
            jq -r --arg prefix "$branch_prefix" --argjson new_pr "$NEW_PR_NUMBER" '
              .[]
              | select(.number != $new_pr)
              | select(.headRefName | startswith($prefix))
              | [.number, .headRefName]
              | @tsv
            ' <<< "$pr_json"
          )

          if [[ ${#candidate_prs[@]} -eq 0 ]]; then
            echo "No open same-agent maintenance PRs to evaluate for supersession."
            exit 0
          fi

          superseded_prs=()
          for candidate in "${candidate_prs[@]}"; do
            IFS=$'\t' read -r pr_number head_ref_name <<< "$candidate"
            candidate_version="${head_ref_name#"${branch_prefix}"}"

            if [[ -z "$candidate_version" || "$candidate_version" == "$head_ref_name" ]]; then
              continue
            fi

            if [[ ! "$candidate_version" =~ $strict_version_regex ]]; then
              echo "Skipping non-version branch: ${head_ref_name}"
              continue
            fi

            lower_version="$(printf '%s\n%s\n' "$candidate_version" "$TARGET_VERSION" | sort -V | head -n1)"
            if [[ "$candidate_version" != "$TARGET_VERSION" && "$lower_version" == "$candidate_version" ]]; then
              # Destructive boundary 3 of 3: supersession, and the only one that asks about a
              # packet other than this run's. A newer version opens a different branch, so its run
              # is in a different concurrency group and can close an older packet while a
              # maintainer is mid-closeout on it. The question is therefore asked about the
              # candidate's version, not this run's.
              set +e
              ./target/debug/xtask maintenance-stand-down-check \
                --agent "$AGENT_ID" \
                --target-version "$candidate_version"
              candidate_status=$?
              set -e
              if [[ "$candidate_status" -ne 0 ]]; then
                echo "::notice title=Packet not superseded::Leaving #${pr_number} open: the stand-down check for ${AGENT_ID} ${candidate_version} exited ${candidate_status}."
                continue
              fi
              superseded_prs+=("$pr_number")
            fi
          done

          if [[ ${#superseded_prs[@]} -eq 0 ]]; then
            echo "No older open same-agent maintenance PRs to supersede."
            exit 0
          fi

          for pr_number in "${superseded_prs[@]}"; do
            gh pr close "$pr_number" --comment "Superseded by #${NEW_PR_NUMBER} for ${AGENT_ID} ${TARGET_VERSION}." || echo "::warning::could not close #$pr_number (already closed?)"
          done
      - name: Print recovery guidance
        if: ${{ steps.create_pr.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_PATH="docs/agents/lifecycle/${{ inputs.agent_id }}-maintenance/governance/maintenance-request.toml"
          PR_SUMMARY_PATH="docs/agents/lifecycle/${{ inputs.agent_id }}-maintenance/governance/pr-summary.md"
          PR_TITLE="chore: open maintenance packet for ${{ inputs.agent_id }} ${{ inputs.target_version }}"
          echo "::error title=Maintenance PR creation failed::Generated packet replay required." >&2
          cat <<EOF >&2
          Recovery path:
          If PR creation fails after packet generation, rerun packet regeneration from the frozen request and reopen the PR from the generated pr-summary path.
          cargo run -p xtask -- refresh-agent --request "${REQUEST_PATH}" --write
          gh pr create --base staging --head "${{ inputs.branch_name }}" --title "${PR_TITLE}" --body-file "${PR_SUMMARY_PATH}"
          EOF
          exit 1

  # Fill the freshly opened packet PR with the COMPLETE multi-target union.
  #
  # The generic executor runs on a single host and can therefore only ever produce a partial,
  # `complete:false` union. Acquisition runs the full cross-platform matrix in the runner and
  # commits the result onto the packet branch, so the PR a maintainer reviews carries the whole
  # surface. Promotion stays a separate, maintainer-triggered `parity-promote` dispatch.
  acquire:
    name: Acquire complete union
    needs: open-pr
    if: ${{ needs.open-pr.outputs.acquire == 'true' && needs.open-pr.outputs.branch_created == 'true' }}
    uses: ./.github/workflows/parity-acquire.yml
    with:
      agent_id: ${{ inputs.agent_id }}
      target_version: ${{ inputs.target_version }}
      ref: ${{ inputs.branch_name }}
      commit: true
    secrets:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}

  # The acquisition's verdict is invisible on the packet PR without this job (`uaa-0031`). The
  # watcher dispatches this workflow on its own ref, so the acquire run's check runs attach to that
  # commit rather than to the packet head, and the PR's own checks come from `ci.yml`, which never
  # runs the maintenance audit. A blocking verdict therefore pushes artifacts and leaves the PR
  # looking green.
  #
  # This job is deliberately weak. It holds no repository write access and no PAT, runs no code
  # from the packet branch, and does exactly two things: read one artifact and write one comment.
  # A failed `union` job empties its outputs, so the verdict arrives as an artifact instead —
  # artifacts are not job outputs and survive the failure that makes them worth reading.
  publish-verdict:
    name: Publish the audit verdict to the packet PR
    needs: [open-pr, acquire]
    if: ${{ always() && needs.open-pr.outputs.pull_request_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download the maintenance audit verdict
        id: verdict
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: "maintenance-audit-verdict-${{ inputs.agent_id }}-${{ inputs.target_version }}-${{ github.run_attempt }}"
          path: _verdict

      - name: Comment the verdict on the packet PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open-pr.outputs.pull_request_number }}
          AGENT_ID: ${{ inputs.agent_id }}
          VERSION: ${{ inputs.target_version }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ACQUIRE_RESULT: ${{ needs.acquire.result }}
        run: |
          set -euo pipefail
          # Markdown code spans are passed as arguments, never written into a single-quoted printf
          # format: a backtick there reads as legacy command substitution to shellcheck, and the
          # workflow linter is not worth arguing with over punctuation.
          BT='`'
          FENCE="${BT}${BT}${BT}"
          VERDICT=_verdict/verdict.json
          MARKER_PREFIX="<!-- maintenance-audit-verdict agent=${AGENT_ID} version=${VERSION} "
          MARKER="${MARKER_PREFIX}run=${RUN_ID} attempt=${RUN_ATTEMPT} -->"

          # Ordering is not generation order: a slow earlier run can finish after a later one and
          # would otherwise replace a current verdict with its own valid but superseded relay
          # command. Run ids increase, so a managed comment from a higher run wins and this one
          # stands down rather than overwriting it.
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate > _comments.json
          EXISTING="$(jq -r --arg prefix "$MARKER_PREFIX" \
            '[.[] | select(.body | contains($prefix))] | last // empty' _comments.json)"
          if [ -n "$EXISTING" ]; then
            EXISTING_ID="$(printf '%s' "$EXISTING" | jq -r '.id')"
            EXISTING_RUN="$(printf '%s' "$EXISTING" | jq -r '.body' | sed -n 's/.*maintenance-audit-verdict [^>]*run=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ -n "$EXISTING_RUN" ] && [ "$EXISTING_RUN" -gt "$RUN_ID" ]; then
              echo "::notice title=Superseded audit verdict::run ${RUN_ID} will not overwrite the verdict from newer run ${EXISTING_RUN}"
              exit 0
            fi
          else
            EXISTING_ID=""
          fi

          BODY=_verdict-comment.md
          {
            printf '%s\n\n' "$MARKER"
            printf '### Maintenance audit — %s%s%s %s\n\n' "$BT" "$AGENT_ID" "$BT" "$VERSION"
          } > "$BODY"

          if [ ! -f "$VERDICT" ]; then
            # No verdict is its own state. It is not a clean audit, and saying which way the
            # producing job went is the only honest thing available.
            {
              printf 'The audit verdict for this run is **unavailable**.\n\n'
              printf -- '- acquisition job result: %s%s%s\n' "$BT" "$ACQUIRE_RESULT" "$BT"
              printf -- '- this is not a clean audit; it means the verdict never reached this job\n'
            } >> "$BODY"
          else
            OBSERVED="$(jq -r '.audit.observed' "$VERDICT")"
            if [ "$OBSERVED" != "true" ]; then
              {
                printf 'The audit **did not run** for this acquisition.\n\n'
                printf -- '- acquisition job result: %s%s%s\n' "$BT" "$ACQUIRE_RESULT" "$BT"
              } >> "$BODY"
            else
              EXIT_CODE="$(jq -r '.audit.exit_code' "$VERDICT")"
              BLOCKING="$(jq -r '.audit.blocking' "$VERDICT")"
              MESSAGE="$(jq -r '.audit.message // ""' "$VERDICT")"
              TITLE="$(jq -r '.audit.title // ""' "$VERDICT")"
              case "$EXIT_CODE" in
                0) printf 'Audit clean. No uplifts required; this packet is closeout-ready.\n' >> "$BODY" ;;
                3)
                  printf 'Uplifts are required. The audit completed; this packet is **not** closeout-ready.\n\n' >> "$BODY"
                  printf 'Run the relay, then replace RUN_ID_FROM_DRY_RUN with the run_id the dry run prints:\n\n' >> "$BODY"
                  printf '%ssh\n' "$FENCE" >> "$BODY"
                  jq -r '.relay.dry_run, .relay.write' "$VERDICT" >> "$BODY"
                  printf '%s\n' "$FENCE" >> "$BODY"
                  ;;
                *)
                  printf '**%s** (exit %s).\n\n' "${TITLE:-Maintenance audit failed}" "$EXIT_CODE" >> "$BODY"
                  if [ -n "$MESSAGE" ]; then
                    # Exit 2 writes no projection, so this is the only place the offending rows are
                    # named. It is upstream text, so it goes in a fenced block and is never eval'd.
                    printf '%stext\n%s\n%s\n' "$FENCE" "$MESSAGE" "$FENCE" >> "$BODY"
                  fi
                  if [ "$BLOCKING" != "true" ]; then
                    printf '\nThis verdict is not blocking for a non-committing run.\n' >> "$BODY"
                  fi
                  ;;
              esac

              ATTEMPTED="$(jq -r '.delivery.attempted' "$VERDICT")"
              if [ "$ATTEMPTED" = "true" ]; then
                COMMITTED="$(jq -r '.delivery.committed' "$VERDICT")"
                REASON="$(jq -r '.delivery.not_delivered_reason // ""' "$VERDICT")"
                if [ "$COMMITTED" = "true" ]; then
                  printf '\n- artifacts committed: %s%s%s\n' "$BT" "$(jq -r '.delivery.head_sha' "$VERDICT")" "$BT" >> "$BODY"
                else
                  printf '\n- artifacts **not** delivered%s\n' "${REASON:+: $REASON}" >> "$BODY"
                fi
              fi
            fi
          fi

          printf '\n[Producing run](%s)\n' "$RUN_URL" >> "$BODY"

          if [ -n "$EXISTING_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" -F "body=@${BODY}"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F "body=@${BODY}"
          fi
