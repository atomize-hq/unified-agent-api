name: Parity acquire

# One reusable, agent-agnostic multi-target acquisition lane.
#
# Everything agent-specific — release source, per-target runners, download URLs, archive shape,
# snapshot command, engine commands — comes from `cli_manifests/<agent>/RULES.json` via
# `xtask manifest-acquisition-plan`. There is intentionally no per-agent branching in this file:
# adding an agent means adding an `acquisition` block, not a workflow.
#
# Release detection and version selection are owned by `agent-maintenance-release-watch.yml`
# (via `xtask maintenance-watch`). This workflow only acquires a version it is handed.

on:
  workflow_call:
    inputs:
      agent_id:
        description: "Registry agent id (e.g. codex)"
        required: true
        type: string
      target_version:
        description: "Bare upstream semver to acquire (e.g. 0.145.0)"
        required: true
        type: string
      ref:
        description: "Branch to check out, and to commit acquired artifacts to when `commit` is true"
        required: false
        default: staging
        type: string
      commit:
        description: "Commit the acquired artifacts back onto `ref`"
        required: false
        default: false
        type: boolean
    secrets:
      AUTOMATION_TOKEN:
        description: "PAT used to push acquired artifacts so the packet PR's CI re-runs"
        required: false
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Registry agent id (e.g. codex)"
        required: true
        type: string
      target_version:
        description: "Bare upstream semver to acquire (e.g. 0.145.0)"
        required: true
        type: string
      ref:
        description: "Branch to check out, and to commit acquired artifacts to when `commit` is true"
        required: false
        default: staging
        type: string
      commit:
        description: "Commit the acquired artifacts back onto `ref`"
        required: false
        default: false
        type: boolean

concurrency:
  group: parity-acquire-${{ inputs.agent_id }}-${{ inputs.target_version }}-${{ inputs.ref }}
  cancel-in-progress: false

# Read-only by default: the plan and snapshot jobs execute or handle downloaded upstream assets,
# so neither may hold a credential that can write to this repository. Only `union` commits.
permissions:
  contents: read

jobs:
  plan:
    name: "Plan + pin (${{ inputs.agent_id }} ${{ inputs.target_version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      snapshot_matrix: ${{ steps.plan.outputs.snapshot_matrix }}
      manifest_root: ${{ steps.plan.outputs.manifest_root }}
      required_target: ${{ steps.plan.outputs.required_target }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # This job downloads and hashes upstream assets. It never talks to this repository's
          # remote, so it has no use for a persisted credential. The one credentialed call it
          # makes is the step-scoped GITHUB_TOKEN against the upstream release API below.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve acquisition plan from RULES.json
        id: plan
        shell: bash
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          mkdir -p _ci_tmp
          cargo run -p xtask -- manifest-acquisition-plan \
            --agent "$AGENT_ID" \
            --version "$VERSION" \
            --emit-json _ci_tmp/acquisition-plan.json

          jq -c '{include: .include}' _ci_tmp/acquisition-plan.json > _ci_tmp/snapshot-matrix.json
          jq -e '.include | length >= 1' _ci_tmp/snapshot-matrix.json > /dev/null

          # Fail here rather than after downloading binaries on four runners: a descriptor that
          # names a command xtask does not have would otherwise only surface once every snapshot
          # job had already paid for its download.
          while IFS= read -r subcommand; do
            [ -n "$subcommand" ] || continue
            if ! cargo run -q -p xtask -- "$subcommand" --help > /dev/null 2>&1; then
              echo "::error title=Unknown xtask subcommand::The acquisition descriptor names \`${subcommand}\`, which xtask does not provide." >&2
              exit 1
            fi
          done < <(jq -r '[.snapshot.command, .union_command, (.wrapper_coverage_command // empty)] | .[]' _ci_tmp/acquisition-plan.json | tr -d '\r')

          {
            echo "snapshot_matrix=$(cat _ci_tmp/snapshot-matrix.json)"
            echo "manifest_root=$(jq -r '.manifest_root' _ci_tmp/acquisition-plan.json)"
            echo "required_target=$(jq -r '.required_target' _ci_tmp/acquisition-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch upstream release metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PLAN=_ci_tmp/acquisition-plan.json
          SOURCE_KIND="$(jq -r '.source_kind' "$PLAN")"
          METADATA_URL="$(jq -r '.release_metadata_url' "$PLAN")"

          # SOURCE_DATE_EPOCH is derived from the upstream publish time so every regenerated
          # artifact is byte-reproducible from committed inputs alone.
          case "$SOURCE_KIND" in
            github_releases)
              curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$METADATA_URL" > _ci_tmp/release.json
              test "$(jq -r '.draft' _ci_tmp/release.json)" = "false"
              test "$(jq -r '.prerelease' _ci_tmp/release.json)" = "false"
              PUBLISHED_AT="$(jq -r '.published_at' _ci_tmp/release.json)"
              ;;
            npm)
              # The full packument is needed for `.time`, which the abbreviated
              # (`application/vnd.npm.install-v1+json`) document omits.
              curl -fsSL -H "Accept: application/json" "$METADATA_URL" > _ci_tmp/packument.json
              PUBLISHED_AT="$(jq -r --arg v "$VERSION" '.time[$v] // empty' _ci_tmp/packument.json)"
              ;;
            *)
              echo "unsupported acquisition source_kind: ${SOURCE_KIND}" >&2
              exit 1
              ;;
          esac

          test -n "$PUBLISHED_AT" && test "$PUBLISHED_AT" != "null"
          echo "source_date_epoch=$(date -d "$PUBLISHED_AT" +%s)" >> "$GITHUB_OUTPUT"

      - name: Download every target asset and refresh artifacts.lock.json
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ steps.plan.outputs.manifest_root }}
        run: |
          set -euo pipefail
          PLAN=_ci_tmp/acquisition-plan.json

          # Each agent's committed lockfile predates any shared schema and uses its own row version
          # key. The descriptor names that key, so only `.artifacts` is rewritten and every
          # lockfile keeps the exact top-level shape it already has.
          VERSION_KEY="$(jq -r '.lockfile_version_key' "$PLAN")"

          mkdir -p _download
          while read -r row; do
            TARGET="$(jq -r '.target_triple' <<<"$row")"
            ASSET="$(jq -r '.asset_name' <<<"$row")"
            URL="$(jq -r '.download_url' <<<"$row")"
            PLATFORM_PACKAGE="$(jq -r '.platform_package // empty' <<<"$row")"

            OUT="_download/${TARGET}-${ASSET}"
            curl -fsSL -o "$OUT" "$URL"
            SIZE_BYTES="$(wc -c < "$OUT" | tr -d ' ')"
            SHA256="$(sha256sum "$OUT" | awk '{print $1}')"

            # Pin integrity must be anchored upstream, not self-attested. Hashing our own download
            # only proves every job in this run saw the same bytes; it says nothing about whether
            # those bytes are what the registry published. npm publishes a per-version digest, so
            # check against it before the digest is written into the lockfile.
            if [ -n "$PLATFORM_PACKAGE" ]; then
              curl -fsSL "https://registry.npmjs.org/${PLATFORM_PACKAGE}/${VERSION}" > _ci_tmp/dist.json
              EXPECTED_INTEGRITY="$(jq -r '.dist.integrity // empty' _ci_tmp/dist.json)"
              EXPECTED_SHASUM="$(jq -r '.dist.shasum // empty' _ci_tmp/dist.json)"
              if [ -n "$EXPECTED_INTEGRITY" ]; then
                # `integrity` is `<algo>-<base64 digest>`, e.g. `sha512-…`.
                ALGO="${EXPECTED_INTEGRITY%%-*}"
                EXPECTED_B64="${EXPECTED_INTEGRITY#*-}"
                ACTUAL_B64="$(openssl dgst "-${ALGO}" -binary "$OUT" | openssl base64 -A)"
                if [ "$ACTUAL_B64" != "$EXPECTED_B64" ]; then
                  echo "::error title=Upstream integrity mismatch::${PLATFORM_PACKAGE}@${VERSION} ${ALGO} expected=${EXPECTED_B64} got=${ACTUAL_B64}" >&2
                  exit 1
                fi
                echo "ok: ${PLATFORM_PACKAGE}@${VERSION} matches published ${ALGO} integrity"
              elif [ -n "$EXPECTED_SHASUM" ]; then
                ACTUAL_SHA1="$(openssl dgst -sha1 -hex "$OUT" | awk '{print $NF}')"
                test "$ACTUAL_SHA1" = "$EXPECTED_SHASUM"
                echo "ok: ${PLATFORM_PACKAGE}@${VERSION} matches published shasum"
              else
                echo "::error title=No upstream digest::${PLATFORM_PACKAGE}@${VERSION} published neither dist.integrity nor dist.shasum" >&2
                exit 1
              fi
            fi

            jq -n \
              --arg key "$VERSION_KEY" --arg v "$VERSION" --arg t "$TARGET" --arg asset "$ASSET" \
              --arg url "$URL" --arg sha "$SHA256" --argjson size "$SIZE_BYTES" \
              --arg pkg "$PLATFORM_PACKAGE" \
              '
                { ($key): $v, target_triple: $t }
                + (if $pkg == "" then {} else {package_name: $pkg, package_version: $v} end)
                + { asset_name: $asset, download_url: $url, sha256: $sha, size_bytes: $size }
              ' \
              > "_download/${TARGET}.artifact.json"
          done < <(jq -c '.include[]' "$PLAN" | tr -d '\r')

          jq -s '.' _download/*.artifact.json > _ci_tmp/artifacts.json

          jq \
            --arg key "$VERSION_KEY" \
            --arg v "$VERSION" \
            --slurpfile new _ci_tmp/artifacts.json \
            '
              .artifacts = (
                  ( .artifacts // [] )
                  | map(select(.[$key] != $v))
                  + $new[0]
                  | unique_by([.[$key], .target_triple])
                  | sort_by([(.[$key]|split(".")|map(tonumber)), .target_triple])
                )
            ' \
            "${ROOT}/artifacts.lock.json" > _ci_tmp/artifacts.lock.json
          mv _ci_tmp/artifacts.lock.json "${ROOT}/artifacts.lock.json"

      - name: Upload plan + pins + downloads
        uses: actions/upload-artifact@v6
        with:
          name: "parity-acquire-pins-${{ inputs.agent_id }}-${{ inputs.target_version }}"
          if-no-files-found: error
          retention-days: 1
          path: |
            _ci_tmp/acquisition-plan.json
            ${{ steps.plan.outputs.manifest_root }}/artifacts.lock.json
            _download/

  snapshot:
    name: "Snapshot (${{ matrix.target_triple }})"
    needs: plan
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.snapshot_matrix) }}
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # This job runs the pinned upstream binary for the help crawl. A persisted credential
          # would sit in .git/config, readable by that binary, until post-job cleanup. The job
          # never talks to this repository's remote, so it needs none.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download plan + pins
        uses: actions/download-artifact@v7
        with:
          name: "parity-acquire-pins-${{ inputs.agent_id }}-${{ inputs.target_version }}"
          path: .

      - name: Install the pinned binary for this target
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          TARGET: ${{ matrix.target_triple }}
          ASSET: ${{ matrix.asset_name }}
          BIN: ${{ matrix.binary_path }}
          ARCHIVE: ${{ matrix.archive }}
          ARCHIVE_MEMBER: ${{ matrix.archive_member }}
        run: |
          set -euo pipefail

          LOCK="${ROOT}/artifacts.lock.json"
          VERSION_KEY="$(jq -r '.lockfile_version_key' _ci_tmp/acquisition-plan.json)"
          # shellcheck disable=SC2016  # jq binds $key/$v/$t/$a through --arg, so the shell must not expand them
          SELECT='.artifacts[] | select(.[$key]==$v and .target_triple==$t and .asset_name==$a)'
          SHA="$(jq -r --arg key "$VERSION_KEY" --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" "${SELECT} | .sha256" "$LOCK")"
          SIZE="$(jq -r --arg key "$VERSION_KEY" --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" "${SELECT} | .size_bytes" "$LOCK")"
          test -n "$SHA" && test "$SHA" != "null"
          test -n "$SIZE" && test "$SIZE" != "null"

          FILE="_download/${TARGET}-${ASSET}"
          test -f "$FILE"

          # Re-verify the pin on the target runner: the pin is the integrity boundary between the
          # download job and every consumer of the resulting snapshot.
          python -c 'import hashlib, sys; p, exp_sha, exp_size = sys.argv[1], sys.argv[2], int(sys.argv[3]); b = open(p, "rb").read(); got_sha = hashlib.sha256(b).hexdigest(); assert got_sha == exp_sha, f"sha256 mismatch: expected={exp_sha} got={got_sha}"; assert len(b) == exp_size, f"size mismatch: expected={exp_size} got={len(b)}"; print(f"ok: {p} sha256={got_sha} size_bytes={len(b)}")' "$FILE" "$SHA" "$SIZE"

          rm -rf _extract
          mkdir -p _extract
          # `cp` + `chmod` rather than `install`: this path now also runs under Git Bash on the
          # Windows runners for npm-sourced agents.
          case "$ARCHIVE" in
            none)
              cp "$FILE" "$BIN"
              ;;
            tar_gz)
              if [ -n "${ARCHIVE_MEMBER:-}" ]; then
                MEMBER="$ARCHIVE_MEMBER"
              else
                MEMBER="$(tar -tzf "$FILE" | awk 'NF && substr($0,length($0),1) != "/" {print; exit}')"
              fi
              test -n "$MEMBER"
              tar -xzf "$FILE" -C _extract "$MEMBER"
              cp "_extract/${MEMBER}" "$BIN"
              ;;
            npm_tgz)
              test -n "${ARCHIVE_MEMBER:-}"
              tar -xzf "$FILE" -C _extract "$ARCHIVE_MEMBER"
              cp "_extract/${ARCHIVE_MEMBER}" "$BIN"
              ;;
            *)
              echo "unsupported archive kind: ${ARCHIVE}" >&2
              exit 1
              ;;
          esac
          chmod +x "$BIN" || true

          # Apply the descriptor's snapshot env before ever executing the binary. Without it an
          # agent with a self-updater could replace itself between the pin check and the capture,
          # making the recorded sha256 a lie about the surface that was snapshotted.
          while read -r pair; do
            NAME="$(jq -r '.name' <<<"$pair")"
            VALUE="$(jq -r '.value' <<<"$pair")"
            export "${NAME}=${VALUE}"
            echo "snapshot env: ${NAME}=${VALUE}"
          done < <(jq -c '.snapshot.env[]?' _ci_tmp/acquisition-plan.json | tr -d '\r')

          "$BIN" --version

      - name: Generate the per-target snapshot
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          TARGET: ${{ matrix.target_triple }}
          BIN: ${{ matrix.binary_path }}
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          PLAN=_ci_tmp/acquisition-plan.json

          SNAPSHOT_COMMAND="$(jq -r '.snapshot.command' "$PLAN")"
          BINARY_ARG="$(jq -r '.snapshot.binary_arg' "$PLAN")"

          # `mapfile` is a bash-4 builtin and the macOS runners ship bash 3.2, so read the array
          # the portable way. The explicit initialisation also keeps `${#EXTRA_ARGS[@]}` valid
          # under `set -u` when the descriptor declares no extra args.
          #
          # `tr -d '\r'` is load-bearing on the Windows runners. Git Bash backs process
          # substitution with a temp file that is subject to text-mode translation, so every line
          # read this way arrives with a trailing CR — while `$(...)` captures, which use a pipe,
          # do not. That asymmetry is why the pinned sha256 verified cleanly a step earlier and
          # this loop still produced `--help-timeout-ms\r`, which clap rejects. The env loops
          # below survived only because their CR lands outside the JSON, where jq discards it as
          # whitespace; that is luck, not design, so every such loop strips CR.
          EXTRA_ARGS=()
          while IFS= read -r extra_arg; do
            EXTRA_ARGS+=("$extra_arg")
          done < <(jq -r '.snapshot.extra_args[]?' "$PLAN" | tr -d '\r')

          while read -r pair; do
            NAME="$(jq -r '.name' <<<"$pair")"
            VALUE="$(jq -r '.value' <<<"$pair")"
            export "${NAME}=${VALUE}"
          done < <(jq -c '.snapshot.env[]?' "$PLAN" | tr -d '\r')

          ARGS=(
            "$SNAPSHOT_COMMAND"
            "$BINARY_ARG" "$BIN"
            --out-file "${ROOT}/snapshots/${VERSION}/${TARGET}.json"
            --capture-raw-help
            --raw-help-target "$TARGET"
          )
          if [ -f "${ROOT}/supplement/commands.json" ]; then
            ARGS+=(--supplement "${ROOT}/supplement/commands.json")
          fi
          if [ ${#EXTRA_ARGS[@]} -gt 0 ]; then
            ARGS+=("${EXTRA_ARGS[@]}")
          fi

          ATTEMPT=1
          while [ "$ATTEMPT" -le 2 ]; do
            set +e
            cargo run -p xtask -- "${ARGS[@]}"
            SNAPSHOT_STATUS=$?
            set -e

            if [ "$SNAPSHOT_STATUS" -eq 0 ]; then
              break
            fi
            if [ "$ATTEMPT" -ge 2 ]; then
              exit "$SNAPSHOT_STATUS"
            fi

            echo "::warning title=Snapshot capture retry::${TARGET} snapshot capture failed on attempt ${ATTEMPT}; retrying once."
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Upload the per-target snapshot
        uses: actions/upload-artifact@v6
        with:
          name: "parity-acquire-snapshot-${{ inputs.agent_id }}-${{ inputs.target_version }}-${{ matrix.target_triple }}"
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ needs.plan.outputs.manifest_root }}/snapshots/${{ inputs.target_version }}/${{ matrix.target_triple }}.json

      # Also runs when capture fails, keeping whatever help was written before the failure. The
      # snapshot upload above stays success-only: the union must never see a `<target>.json` from a
      # failed capture. A capture that fails at the root (e.g. a rejected `--enable`) writes no
      # help, so only warn off the success path.
      - name: Upload the raw help capture (never committed)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: "parity-acquire-raw-help-${{ inputs.agent_id }}-${{ inputs.target_version }}-${{ matrix.target_triple }}"
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 1
          path: |
            ${{ needs.plan.outputs.manifest_root }}/raw_help/${{ inputs.target_version }}/${{ matrix.target_triple }}/

  union:
    name: "Union → report → validate (${{ inputs.agent_id }})"
    needs: [plan, snapshot]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      closeout_ready: ${{ steps.maintenance_audit.outputs.closeout_ready }}
      uplifts_required: ${{ steps.maintenance_audit.outputs.uplifts_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Pushes authenticated with GITHUB_TOKEN do not start new workflow runs. Without a PAT
          # the packet PR would keep showing the CI result from the pre-acquisition commit, so a
          # maintainer would be reviewing a green check that never saw the acquired artifacts.
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download plan + pins
        uses: actions/download-artifact@v7
        with:
          name: "parity-acquire-pins-${{ inputs.agent_id }}-${{ inputs.target_version }}"
          path: .

      - name: Download every per-target snapshot from this run
        uses: actions/download-artifact@v7
        with:
          pattern: "parity-acquire-snapshot-${{ inputs.agent_id }}-${{ inputs.target_version }}-*"
          path: _snapshots
          merge-multiple: true

      - name: Materialize snapshots and assert the required target is present
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          REQUIRED_TARGET: ${{ needs.plan.outputs.required_target }}
        run: |
          set -euo pipefail
          PLAN=_ci_tmp/acquisition-plan.json
          DEST="${ROOT}/snapshots/${VERSION}"
          mkdir -p "$DEST"

          while read -r target; do
            # The checkout may already contain this version. Clear only the planned target before
            # looking for this run's artifact so a failed snapshot leg cannot reuse stale evidence.
            rm -f "${DEST}/${target}.json"
            FOUND="$(find _snapshots -type f -name "${target}.json" -print -quit || true)"
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "${DEST}/${target}.json"
            fi
          done < <(jq -r '.include[].target_triple' "$PLAN" | tr -d '\r')

          if [ ! -f "${DEST}/${REQUIRED_TARGET}.json" ]; then
            echo "::error title=Missing required snapshot::${REQUIRED_TARGET} produced no snapshot; the union cannot be built." >&2
            exit 1
          fi

          # Surface partial acquisition loudly: the union will still be written with
          # complete=false, but a maintainer should not have to read job logs to notice.
          MISSING=0
          while read -r target; do
            if [ ! -f "${DEST}/${target}.json" ]; then
              echo "::warning title=Missing target snapshot::${target} produced no snapshot; union will be incomplete."
              MISSING=$((MISSING + 1))
            fi
          done < <(jq -r '.include[].target_triple' "$PLAN" | tr -d '\r')
          echo "missing target snapshots: ${MISSING}"

      - name: Union → wrapper coverage → report → version metadata → validate
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          PLAN=_ci_tmp/acquisition-plan.json

          UNION_COMMAND="$(jq -r '.union_command' "$PLAN")"
          cargo run -p xtask -- "$UNION_COMMAND" --root "$ROOT" --version "$VERSION"

          WRAPPER_COVERAGE_COMMAND="$(jq -r '.wrapper_coverage_command // empty' "$PLAN")"
          if [ -n "$WRAPPER_COVERAGE_COMMAND" ]; then
            cargo run -p xtask -- "$WRAPPER_COVERAGE_COMMAND" --out "${ROOT}/wrapper_coverage.json"
          else
            echo "no wrapper_coverage_command declared; keeping the committed wrapper_coverage.json"
          fi

          cargo run -p xtask -- manifest-report --root "$ROOT" --version "$VERSION"
          cargo run -p xtask -- manifest-version-metadata --root "$ROOT" --version "$VERSION" --status reported
          cargo run -p xtask -- support-matrix
          cargo run -p xtask -- manifest-validate --root "$ROOT"

      - name: Maintenance audit gate
        id: maintenance_audit
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          AGENT_ID: ${{ inputs.agent_id }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          REQUEST_PATH="docs/agents/lifecycle/${AGENT_ID}-maintenance/governance/maintenance-request.toml"
          STATUS_JSON="_ci_tmp/audit/status.json"
          COMMAND_STDOUT="_ci_tmp/audit/stdout.log"
          COMMAND_STDERR="_ci_tmp/audit/stderr.log"
          UNION="${ROOT}/snapshots/${VERSION}/union.json"

          mkdir -p _ci_tmp/audit

          emit_gate_outputs() {
            local closeout_ready="$1"
            local uplifts_required="$2"
            local audit_failed="$3"
            local audit_exit_code="$4"
            local audit_title="$5"
            local audit_message="$6"
            local audit_message_delimiter
            audit_message_delimiter="audit_message_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "closeout_ready=${closeout_ready}"
              echo "uplifts_required=${uplifts_required}"
              echo "audit_failed=${audit_failed}"
              echo "audit_exit_code=${audit_exit_code}"
              echo "audit_title=${audit_title}"
              echo "audit_message<<${audit_message_delimiter}"
              printf '%s\n' "$audit_message"
              echo "${audit_message_delimiter}"
            } >> "$GITHUB_OUTPUT"
          }

          summarize_clean() {
            {
              echo "## Maintenance audit gate"
              echo
              echo "- status: clean"
              echo "- closeout_ready: \`true\`"
              echo "- uplifts_required: \`false\`"
              echo "- packet: \`${AGENT_ID}-maintenance\` is clean for \`${VERSION}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          summarize_uplifts() {
            {
              echo "## Maintenance audit gate"
              echo
              echo "- status: uplifts required"
              echo "- closeout_ready: \`false\`"
              echo "- uplifts_required: \`true\`"
              echo
              echo "> Relay invocation placeholder (T3): contributor relay command renders here."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          summarize_failure() {
            local status_label="$1"
            local audit_exit_code="$2"
            local audit_message="$3"
            {
              echo "## Maintenance audit gate"
              echo
              echo "- status: ${status_label}"
              echo "- closeout_ready: \`false\`"
              echo "- uplifts_required: \`false\`"
              echo "- audit_exit_code: \`${audit_exit_code}\`"
              echo "- reason: \`${audit_message}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          last_nonblank_line() {
            local log="$1"
            local result=""
            local line
            [ -f "$log" ] || return 0
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                *[![:space:]]*)
                  result="$line"
                  ;;
              esac
            done < "$log"
            printf '%s' "$result"
          }

          if [ ! -f "$REQUEST_PATH" ]; then
            # `manifest-acquisition-plan` already proves this workflow only reaches the gate for
            # release-watch-enrolled agents that carry an acquisition descriptor. A missing request
            # path here is therefore a broken packet path, not a docs-only skip condition.
            COMMAND_MESSAGE="parity-acquire planned acquisition for ${AGENT_ID}, but the maintenance request path ${REQUEST_PATH} is missing; the request must exist for the version under acquisition."
            echo "::error title=Maintenance audit failed::${COMMAND_MESSAGE}" >&2
            emit_gate_outputs "false" "false" "true" "2" "Maintenance audit failed" "$COMMAND_MESSAGE"
            summarize_failure "failed" "2" "$COMMAND_MESSAGE"
            exit 0
          fi

          : > "$COMMAND_STDOUT"
          : > "$COMMAND_STDERR"
          set +e
          cargo run -p xtask -- maintenance-audit-status \
            --request "$REQUEST_PATH" \
            --expect-target-version "$VERSION" \
            --emit-json "$STATUS_JSON" \
            >"$COMMAND_STDOUT" 2>"$COMMAND_STDERR"
          AUDIT_STATUS=$?
          set -e

          cat "$COMMAND_STDOUT"
          cat "$COMMAND_STDERR" >&2

          case "$AUDIT_STATUS" in
            0)
              emit_gate_outputs "true" "false" "false" "0" "" ""
              summarize_clean
              ;;
            3)
              emit_gate_outputs "false" "true" "false" "3" "" ""
              summarize_uplifts
              ;;
            4)
              MISSING_TARGETS="$(jq -r '(.missing_targets // []) | join(", ") | if . == "" then "unknown" else . end' "$UNION" 2>/dev/null || printf '%s' 'unknown')"
              COMMAND_MESSAGE="maintenance-audit-status reported that the acquisition union this run produced is incomplete; missing targets: ${MISSING_TARGETS}"
              echo "::error title=Incomplete acquisition::${COMMAND_MESSAGE}" >&2
              emit_gate_outputs "false" "false" "true" "$AUDIT_STATUS" "Incomplete acquisition" "$COMMAND_MESSAGE"
              summarize_failure "incomplete acquisition" "$AUDIT_STATUS" "$COMMAND_MESSAGE"
              ;;
            5)
              COMMAND_MESSAGE="$(last_nonblank_line "$COMMAND_STDERR")"
              if [ -z "$COMMAND_MESSAGE" ]; then
                COMMAND_MESSAGE="maintenance-audit-status reported a target version mismatch; see command output above."
              fi
              if [ "$COMMIT" = "true" ]; then
                echo "::error title=Target version mismatch::${COMMAND_MESSAGE}" >&2
                emit_gate_outputs "false" "false" "true" "$AUDIT_STATUS" "Target version mismatch" "$COMMAND_MESSAGE"
                summarize_failure "target version mismatch" "$AUDIT_STATUS" "$COMMAND_MESSAGE"
              else
                echo "::notice title=Target version mismatch::${COMMAND_MESSAGE}" >&2
                emit_gate_outputs "false" "false" "false" "$AUDIT_STATUS" "Target version mismatch" "$COMMAND_MESSAGE"
                summarize_failure "target version mismatch (dry run, not blocking)" "$AUDIT_STATUS" "$COMMAND_MESSAGE"
              fi
              ;;
            *)
              COMMAND_MESSAGE=""
              for LOG in "$COMMAND_STDERR" "$COMMAND_STDOUT"; do
                [ -f "$LOG" ] || continue
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    *[![:space:]]*)
                      COMMAND_MESSAGE="$line"
                      ;;
                  esac
                done < "$LOG"
                if [ -n "$COMMAND_MESSAGE" ]; then
                  break
                fi
              done

              if [ -n "$COMMAND_MESSAGE" ]; then
                echo "::error title=Maintenance audit failed::${COMMAND_MESSAGE}" >&2
              else
                COMMAND_MESSAGE="maintenance-audit-status exited ${AUDIT_STATUS}; see command output above."
                echo "::error title=Maintenance audit failed::${COMMAND_MESSAGE}" >&2
              fi
              emit_gate_outputs "false" "false" "true" "$AUDIT_STATUS" "Maintenance audit failed" "$COMMAND_MESSAGE"
              summarize_failure "failed" "$AUDIT_STATUS" "$COMMAND_MESSAGE"
              ;;
          esac

      - name: Summarize the acquired union
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          AGENT_ID: ${{ inputs.agent_id }}
        run: |
          set -euo pipefail
          UNION="${ROOT}/snapshots/${VERSION}/union.json"
          {
            echo "## Parity acquire — \`${AGENT_ID}\` ${VERSION}"
            echo
            echo "- complete: \`$(jq -r '.complete' "$UNION")\`"
            echo "- inputs: \`$(jq -r '[.inputs[].target_triple] | join(", ")' "$UNION")\`"
            echo "- missing: \`$(jq -r '(.missing_targets // []) | join(", ") | if . == "" then "none" else . end' "$UNION")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove CI-only downloads before committing
        shell: bash
        env:
          ROOT: ${{ needs.plan.outputs.manifest_root }}
        run: |
          set -euo pipefail
          rm -rf _download _extract _snapshots _ci_tmp
          rm -rf "${ROOT}/raw_help"

      - name: Commit the acquired artifacts onto the packet branch
        if: ${{ inputs.commit }}
        shell: bash
        env:
          VERSION: ${{ inputs.target_version }}
          ROOT: ${{ needs.plan.outputs.manifest_root }}
          AGENT_ID: ${{ inputs.agent_id }}
          BRANCH: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These are the two paths `xtask support-matrix` actually publishes
          # (support_matrix::JSON_OUTPUT_PATH and MARKDOWN_OUTPUT_PATH). `git add` fails the whole
          # commit on a pathspec that matches nothing, so a wrong path here does not degrade
          # gracefully — it discards an entire acquisition run at the last step.
          git add \
            "${ROOT}/snapshots/${VERSION}" \
            "${ROOT}/reports/${VERSION}" \
            "${ROOT}/versions/${VERSION}.json" \
            "${ROOT}/wrapper_coverage.json" \
            "${ROOT}/artifacts.lock.json" \
            cli_manifests/support_matrix/current.json \
            docs/specs/unified-agent-api/support-matrix.md

          if git diff --cached --quiet; then
            echo "no acquisition changes to commit"
            exit 0
          fi

          git commit -m "chore(${AGENT_ID}): acquire parity artifacts for ${VERSION}"

          # The snapshot matrix can take the better part of an hour, so the packet branch may have
          # moved. Rebase and retry rather than letting a non-fast-forward throw away every
          # downloaded binary, snapshot, union and report this run produced.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push attempt ${attempt} was rejected; rebasing onto origin/${BRANCH}"
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}"
          done

          echo "::error title=Could not push acquired artifacts::${BRANCH} kept moving under this run." >&2
          exit 1

      - name: Upload the committed artifact bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: "parity-acquire-artifacts-${{ inputs.agent_id }}-${{ inputs.target_version }}"
          if-no-files-found: error
          path: |
            ${{ needs.plan.outputs.manifest_root }}/snapshots/${{ inputs.target_version }}/
            ${{ needs.plan.outputs.manifest_root }}/reports/${{ inputs.target_version }}/
            ${{ needs.plan.outputs.manifest_root }}/versions/${{ inputs.target_version }}.json
            ${{ needs.plan.outputs.manifest_root }}/wrapper_coverage.json
            ${{ needs.plan.outputs.manifest_root }}/artifacts.lock.json

      - name: Fail the job if the maintenance audit recorded a blocking verdict
        if: ${{ always() && steps.maintenance_audit.outputs.audit_failed == 'true' }}
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.maintenance_audit.outputs.audit_exit_code }}
          AUDIT_TITLE: ${{ steps.maintenance_audit.outputs.audit_title }}
          AUDIT_MESSAGE: ${{ steps.maintenance_audit.outputs.audit_message }}
        run: |
          set -euo pipefail
          if [ -n "$AUDIT_MESSAGE" ]; then
            echo "::error title=${AUDIT_TITLE}::${AUDIT_MESSAGE}" >&2
          else
            echo "::error title=${AUDIT_TITLE}::maintenance audit gate recorded a blocking verdict." >&2
          fi
          case "$AUDIT_EXIT_CODE" in
            ''|*[!0-9]*)
              ;;
            *)
              if [ "$AUDIT_EXIT_CODE" -ge 1 ] 2>/dev/null && [ "$AUDIT_EXIT_CODE" -le 255 ] 2>/dev/null; then
                exit "$AUDIT_EXIT_CODE"
              fi
              ;;
          esac
          echo "::error title=Invalid maintenance audit exit code::The recorded audit exit code '${AUDIT_EXIT_CODE}' was invalid; expected an integer from 1 through 255." >&2
          exit 1
